name: Update Resolvers

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Fetch
        run: bash scripts/fetch.sh

      - name: Validate
        run: bash scripts/validate.sh

      - name: Generate
        run: bash scripts/generate.sh

      - name: Commit
        run: |
          git config user.name "Abid Ahmad"
          git config user.email "149966763+0xAb1d@users.noreply.github.com"

          git add resolvers.txt resolvers-trusted.txt data/metrics.csv data/stats.json README.md

          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi

          total=$(wc -l < resolvers.txt | tr -d ' ')
          trusted=$(wc -l < resolvers-trusted.txt | tr -d ' ')

          git commit -m "resolvers updated · $total validated · $trusted trusted"
          git push
